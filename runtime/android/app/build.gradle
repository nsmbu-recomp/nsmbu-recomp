

plugins {
    id 'com.android.application'
}

android {
    namespace = "org.nsmbrecomp.nsmbu"
    compileSdk 36
    buildToolsVersion "35.0.0"
    ndkVersion "30.0.16248370"
    defaultConfig {
        applicationId "org.nsmbrecomp.nsmbu"
        minSdk 33
        targetSdk 36
        versionCode providers.gradleProperty('nsmbuVersionCode').map { it as int }.getOrElse(1)
        versionName providers.gradleProperty('nsmbuVersionName').getOrElse('0.1')
        ndk { abiFilters providers.gradleProperty('nsmbuAbi').getOrElse('arm64-v8a') }
    }
    def signing = { String env, String property ->
        [providers.environmentVariable(env).orNull, providers.gradleProperty(property).orNull].find { it }
    }
    def releaseKeystore = signing('NSMBU_KEYSTORE', 'nsmbuKeystore')
    signingConfigs {
        if (releaseKeystore != null) {
            release {
                def storePass = signing('NSMBU_KEYSTORE_PASSWORD', 'nsmbuKeystorePassword')
                def alias = signing('NSMBU_KEY_ALIAS', 'nsmbuKeyAlias')
                if (storePass == null || alias == null)
                    throw new GradleException('Release signing needs the keystore password and key alias too')
                storeFile file(releaseKeystore)
                storePassword storePass
                keyAlias alias
                keyPassword signing('NSMBU_KEY_PASSWORD', 'nsmbuKeyPassword') ?: storePass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore != null ? signingConfigs.release : signingConfigs.debug
            manifestPlaceholders = [appIcon: '@mipmap/ic_launcher']
        }
    }
    sourceSets.main.jniLibs.srcDirs = ['libs']
    def pythonPackage = providers.gradleProperty('nsmbuPythonDir').orNull
    if (pythonPackage != null) {
        sourceSets.main.jniLibs.srcDirs += [file(pythonPackage + '/jniLibs')]
        sourceSets.main.assets.srcDirs += [file(pythonPackage + '/assets')]
    }
    def toolchainPackage = providers.gradleProperty('nsmbuToolchainDir').orNull
    if (toolchainPackage != null) {
        sourceSets.main.jniLibs.srcDirs += [file(toolchainPackage + '/jniLibs')]
        sourceSets.main.assets.srcDirs += [file(toolchainPackage + '/assets')]
    }
    def extractorPackage = providers.gradleProperty('nsmbuExtractorDir').orNull
    if (extractorPackage != null) {
        sourceSets.main.jniLibs.srcDirs += [file(extractorPackage + '/jniLibs')]
        sourceSets.main.assets.srcDirs += [file(extractorPackage + '/assets')]
    }

    def gameIcon = file('local-res').exists()
    if (gameIcon) {
        sourceSets.debug.res.srcDirs += ['local-res']
    }
    android.buildTypes.debug.manifestPlaceholders = [appIcon: gameIcon ? '@mipmap/ic_game' : '@mipmap/ic_launcher']
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libmain.so']
            if (toolchainPackage != null || extractorPackage != null) keepDebugSymbols += ['**/libnsmbu-*.so']
        }
    }
    lint { abortOnError = false }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

tasks.register('verifyReleasePython') {
    doLast {
        def pythonPackage = providers.gradleProperty('nsmbuPythonDir').orNull
        if (pythonPackage != null) {
            def archive = new java.util.zip.ZipFile(file(pythonPackage + '/assets/python-source.zip'))
            try {
                if (['tools/android/debug_fixture_build.py', 'recomp/android_fixture.py',
                     'tools/android/runtime_fixture.c'].any { archive.getEntry(it) != null })
                    throw new GradleException('Debug fixture sources must not ship in release Python packages')
            } finally { archive.close() }
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleasePython' }

def debugSuffix = providers.gradleProperty('nsmbuDebugSuffix').getOrElse('')
if (!debugSuffix.isEmpty()) {
    if (!(debugSuffix ==~ /\.[a-z][a-z0-9_]*/)) throw new GradleException('nsmbuDebugSuffix must look like .labtest')
    android.buildTypes.debug.applicationIdSuffix = debugSuffix
}
