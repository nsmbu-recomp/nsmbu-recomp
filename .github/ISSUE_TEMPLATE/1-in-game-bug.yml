name: In-game bug
description: Something goes wrong while playing (graphics, gameplay, sound, controls, crash during play).
labels: ["bug", "in-game"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Say which world and course you were in.

        **Never share full save states** (`slotN.bin`). They contain the game's own code and data.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game, and what you did right before it happened.
      placeholder: |
        1. Go to ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: savefile
    attributes:
      label: Where you were
      description: |
        Say the world and course, and what you did just before the problem.

        **Never attach full save states** (`slotN.bin`, from Shift+F1–F5 or the Saves tab). They contain the game's code and data.
      placeholder: "World 1-1, after the first ? block, or: I can't say because ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.2.1), or the commit if you built it yourself (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: game_version
    attributes:
      label: Game version
      description: Which NSMBU dump you installed (region and update).
      options:
        - USA 1.3.0
        - USA base disc
        - Europe 1.3.0
        - Europe base disc
        - NSMBU + NSLU (USA)
        - NSMBU + NSLU (Europe)
        - Not sure
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Windows, macOS, Linux (x86-64), Linux (arm64), or Android. Report crash fills this for you.
      placeholder: e.g. Windows
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU and RAM (e.g. "Ryzen 5 5600, RTX 3060, 16 GB" or "M1, 8 GB").
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag the log file in below.

        - Crash: newest `crash-<date>-<time>.log`
        - No crash: `nsmbu.log`
        - Portable: `data/nsmbu/logs/`
        - From source: `nsmbu/logs/`
        - AppImage: `~/.config/nsmbu/logs/`

        Full paths: https://github.com/nsmbu-recomp/nsmbu-recomp/blob/main/docs/user/logs.md
    validations:
      required: true
  - type: textarea
    id: app_info
    attributes:
      label: From the app
      description: Filled by Report crash with the error dialog text. Leave blank if you opened this form yourself.
    validations:
      required: false
