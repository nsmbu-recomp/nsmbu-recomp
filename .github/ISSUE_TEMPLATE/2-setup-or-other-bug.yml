name: Setup, start or other bug
description: The setup fails, the game doesn't start, or a problem outside of playing (menus of the launcher, installation, downloads).
labels: ["bug", "setup"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For problems **while playing**, please use the "In-game bug" form instead (it asks for your save file).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, and the exact error message (screenshot or text).
      placeholder: |
        1. Go to ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.2.1), or the commit if you built it yourself (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: game_version
    attributes:
      label: Game version
      description: Which NSMBU dump you installed (region and update).
      options:
        - USA 1.3.0
        - USA base disc
        - Europe 1.3.0
        - Europe base disc
        - NSMBU + NSLU (USA)
        - NSMBU + NSLU (Europe)
        - Not sure
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Windows, macOS, Linux (x86-64), Linux (arm64), or Android. Report issue fills this for you.
      placeholder: e.g. Windows
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU and RAM (e.g. "Ryzen 5 5600, RTX 3060, 16 GB" or "M1, 8 GB").
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag the log file in below.

        - Setup failed: `data/setup.log` (portable), or Copy log in the setup window
        - Crash: newest `crash-<date>-<time>.log` under `data/nsmbu/logs/`
        - AppImage: `~/.config/nsmbu/logs/`

        Full paths: https://github.com/nsmbu-recomp/nsmbu-recomp/blob/main/docs/user/logs.md
    validations:
      required: true
  - type: textarea
    id: app_info
    attributes:
      label: From the app
      description: Filled by Report issue with the error dialog text. Leave blank if you opened this form yourself.
    validations:
      required: false
