# Release build: packages the runtime, tools and installer for macOS (arm64), Linux (x86-64 and
# arm64) and Windows (x86-64 and arm64), and the Android APK (arm64, x86_64), and publishes them
# as a GitHub Release.
#
# Legal: CI never has the game. Every build here uses placeholder guest code
# (tools/recomp/stubgen.py) only to compile and test the runtime; the real game code is generated
# and compiled on the player's machine by the installer. tools/release/guard.py fails the job if
# an artifact contains game code, game files, saves, shader caches or key-like strings.
#
# Triggers: pushing a tag v* publishes a release. "Run workflow" (workflow_dispatch) builds and
# checks the same artifacts without publishing (dry run); with dry_run unchecked on a v* tag it
# publishes too.
#
# Development builds: "Run workflow" on main with devel_build checked publishes the same artifacts
# as the rolling pre-release "devel-build" (replaced each time, never marked latest). The nightly
# schedule runs on the default branch and only starts such a run when main has moved since the
# current "devel-build" pre-release.
#
# Toolchains: installer/toolchains.json pins the exact compilers. The Windows and Linux
# runtimes are built with the same pinned llvm-mingw / zig the installer downloads for players,
# so the prebuilt runtime links with the player's locally compiled game code.
# SDL3 is not compiled here. Jobs install the sdl3 release from nsmbu-recomp/ci-assets
# (tools/release/sdl3.py). Rebuild that release when the SDL pin or llvm-mingw pin changes.
name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check the artifacts, do not publish"
        type: boolean
        default: true
      devel_build:
        description: "Development build: publish as the rolling pre-release 'devel-build' (run on main)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  VULKAN_HEADERS_URL: https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.363.tar.gz
  VULKAN_HEADERS_SHA256: cbaf687d3c59b9666fe080e7f8396b6b4f4d344a768ee6b337c59852f4526b68
  VULKAN_DEF_URL: https://raw.githubusercontent.com/KhronosGroup/Vulkan-Loader/vulkan-sdk-1.4.363.0/loader/vulkan-1.def
  VULKAN_DEF_SHA256: 9ba339b7f5ee2df28487698a6840ecf095fac58b415c2c89ad9f161e9d316378

jobs:
  version:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write   # the nightly schedule starts the development build on main
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      devel: ${{ steps.v.outputs.devel }}
      skip: ${{ steps.v.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # nightly: start a development build on main only when main moved since the last one
            head=$(gh api "repos/$GH_REPO/commits/main" -q .sha)
            built=$(gh api "repos/$GH_REPO/commits/devel-build" -q .sha 2>/dev/null || true)
            echo "main $head, last development build ${built:-none}"
            if [[ "$head" != "$built" ]]; then
              gh workflow run release.yml --ref main -f devel_build=true -f dry_run=true
              echo "development build started"
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.devel_build }}" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::development builds run on main (this run is on $GITHUB_REF)"; exit 1
            fi
            # the last release plus the commit: "v0.7.0-devel.1a2b3c4d" (the release part is what
            # version comparisons read; a bare "devel-..." would look older than every release)
            base=$(gh api "repos/$GH_REPO/releases/latest" -q .tag_name 2>/dev/null || true)
            [[ "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no latest release tag (got '$base')"; exit 1; }
            echo "version=$base-devel.${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "devel=true" >> "$GITHUB_OUTPUT"
            echo "version: $base-devel.${GITHUB_SHA::8}, development pre-release"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dryrun-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then publish=true; fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.dry_run }}" == false ]]; then publish=true; fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version: $(grep version= "$GITHUB_OUTPUT"), publish: $publish"

  macos:
    needs: version
    if: needs.version.outputs.skip != 'true'
    # macOS 15 SDK (Xcode 16) needed: the Metal renderer uses MTLMathMode; the app runs on macOS 14+
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: LuaJIT submodule
        run: git submodule update --init vendor/luajit

      - name: Install build tools
        run: brew install ninja

      - name: Build runtime (Release, Metal) against placeholder guest code
        run: |
          python3 tools/recomp/stubgen.py build/gen-stub
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DNSMBU_VERSION="$VERSION" -DNSMBU_RENDERER=METAL \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DGEN_DIR="$PWD/build/gen-stub" -DNSMBU_SETUP_GUI=ON \
            -DNSMBU_BUNDLED_ZSTD=ON
          cmake --build build/rel

      - name: Unit tests
        run: |
          ctest --test-dir build/rel --output-on-failure
          python3 installer/test_setup.py
          python3 tools/recomp/test_builds.py
          python3 tools/recomp/test_output.py
          python3 tools/recomp/test_pool.py

      - name: Package
        run: |
          python3 tools/release/package.py --build build/rel --platform macos-arm64 --version "$VERSION" \
            --out dist --toolchain xcode-clt --setup-gui build/rel/nsmbu-setup

      - name: Guard (no game code, game files or keys)
        run: python3 tools/release/guard.py dist/*.zip

      - name: Installer self-test (unzipped release, placeholder code)
        run: |
          mkdir -p "$RUNNER_TEMP/unz" && cd "$RUNNER_TEMP/unz" && unzip -q "$GITHUB_WORKSPACE"/dist/*.zip
          cd NSMBU-*
          bash "./tools/Setup in Terminal.command" --yes --no-launch --gen-dir "$GITHUB_WORKSPACE/build/gen-stub" \
            --data-dir "$RUNNER_TEMP/data"
          # fatal dialogs block CI (macOS CFUserNotification); log only
          NSMBU_HIDDEN_WINDOWS=1 "$RUNNER_TEMP/data/bin/nsmbu" --game "$RUNNER_TEMP/nogame" > run.log 2>&1 || true
          cat run.log
          grep -q "Game folder not found" run.log
          # the graphical installer: starts setup.py through the launcher and renders its first screen
          SDL_VIDEO_DRIVER=offscreen "./NSMBU.app/Contents/MacOS/nsmbu-launcher" --self-test \
            --screenshots "$RUNNER_TEMP" --data-dir "$RUNNER_TEMP/data"
          mkdir -p "$GITHUB_WORKSPACE/gui-shots" && cp "$RUNNER_TEMP"/selftest-*.png "$GITHUB_WORKSPACE/gui-shots/"

      - uses: actions/upload-artifact@v4
        with:
          name: setup-gui-macos-arm64
          path: gui-shots

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: version
    if: needs.version.outputs.skip != 'true'
    # x86-64 and arm64 (aarch64), each built and tested on its own architecture's runner.
    # glibc 2.35: the oldest base the release supports (Ubuntu 22.04, Debian 12, Fedora 36, SteamOS 3,
    # Raspberry Pi OS 12 64-bit)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            toolchain: zig-0.16.0
          - arch: aarch64
            runner: ubuntu-22.04-arm
            toolchain: zig-0.16.0-aarch64
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      TOOLCHAIN: ${{ matrix.toolchain }}
      # A fresh zig has an empty global cache, and the first compile then spends about a minute
      # identifying the compiler. ccache keeps the object files. Both paths stay under the
      # workspace so the cache key does not follow a random runner temp directory.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@v4

      - name: LuaJIT submodule
        run: git submodule update --init vendor/luajit

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libraries the prebuilt SDL3 was linked against (SDL3 docs/README-linux.md, Ubuntu 22.04+ set),
          # so the shipped SDL3 keeps every backend (X11, Wayland, PipeWire/PulseAudio/ALSA, input, IME);
          # libvulkan1 is only linked against (players use their own Vulkan loader)
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config xz-utils libvulkan1 \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev wayland-protocols \
            mesa-vulkan-drivers xvfb

      - name: Cache the zig compiler and ccache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            .zig-cache
          key: release-linux-${{ matrix.arch }}-${{ env.TOOLCHAIN }}-${{ github.sha }}
          restore-keys: |
            release-linux-${{ matrix.arch }}-${{ env.TOOLCHAIN }}-

      - name: Pinned zig toolchain (installer/toolchains.json)
        run: |
          read -r URL SUM DIR TARGET < <(python3 -c "
          import json, os; t=json.load(open('installer/toolchains.json'))['toolchains'][os.environ['TOOLCHAIN']]
          print(t['url'], t['sha256'], t['dir'], t['target'])")
          # A stable compiler path keeps the ccache key the same on the next tag.
          ROOT="$HOME/zig-toolchain"
          mkdir -p "$ROOT"
          echo "ZIG_DIR=$ROOT/$DIR" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$URL"
          echo "$SUM  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$ROOT"
          ZIG="$ROOT/$DIR/zig"
          mkdir -p "$ROOT/bin"
          printf '#!/bin/sh\nexec "%s" cc -target %s "$@"\n' "$ZIG" "$TARGET" > "$ROOT/bin/zcc"
          printf '#!/bin/sh\nexec "%s" c++ -target %s "$@"\n' "$ZIG" "$TARGET" > "$ROOT/bin/zcxx"
          printf '#!/bin/sh\nexec "%s" ar "$@"\n' "$ZIG" > "$ROOT/bin/zar"
          printf '#!/bin/sh\nexec "%s" ranlib "$@"\n' "$ZIG" > "$ROOT/bin/zranlib"
          chmod +x "$ROOT"/bin/*
          echo "ZBIN=$ROOT/bin" >> "$GITHUB_ENV"

      - name: SDL3 from nsmbu-recomp/ci-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/sdl3.py install --platform "linux-$ARCH" --dest "$HOME/sdl3"

      - name: Vulkan headers
        run: |
          curl -fsSL -o vh.tar.gz "$VULKAN_HEADERS_URL"
          echo "$VULKAN_HEADERS_SHA256  vh.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/vulkan" && tar -xzf vh.tar.gz -C "$HOME/vulkan" --strip-components=1

      - name: Build runtime (Release, Vulkan + SDL3) with zig against placeholder guest code
        run: |
          python3 tools/recomp/stubgen.py build/gen-stub
          ccache -z
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DNSMBU_VERSION="$VERSION" -DGEN_DIR="$PWD/build/gen-stub" \
            -DCMAKE_C_COMPILER="$ZBIN/zcc" -DCMAKE_CXX_COMPILER="$ZBIN/zcxx" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_AR="$ZBIN/zar" -DCMAKE_RANLIB="$ZBIN/zranlib" \
            -DNSMBU_BUNDLED_DEPS=ON -DCMAKE_PREFIX_PATH="$HOME/sdl3" -DNSMBU_SETUP_GUI=ON \
            -DVulkan_INCLUDE_DIR="$HOME/vulkan/include" \
            -DVulkan_LIBRARY="/usr/lib/$ARCH-linux-gnu/libvulkan.so.1"
          cmake --build build/rel
          ccache -s

      - name: Unit tests
        run: |
          export LD_LIBRARY_PATH="$HOME/sdl3/lib"
          ctest --test-dir build/rel --output-on-failure
          python3 installer/test_setup.py
          python3 tools/recomp/test_builds.py
          python3 tools/recomp/test_output.py
          python3 tools/recomp/test_pool.py

      - name: Package
        run: |
          python3 tools/release/package.py --build build/rel --platform "linux-$ARCH" --version "$VERSION" \
            --out dist --toolchain "$TOOLCHAIN" --setup-gui build/rel/nsmbu-setup \
            --runtime-file "$HOME/sdl3/lib/libSDL3.so.0" \
            --linkonly-lib "/usr/lib/$ARCH-linux-gnu/libvulkan.so.1" \
            --license "SDL3 (zlib)=$HOME/sdl3/LICENSE.txt" \
            --license "Vulkan-Headers (Apache-2.0)=$HOME/vulkan/LICENSE.md" \
            --license "glslang (BSD-3-Clause and others)=$PWD/build/rel/_deps/glslang-src/LICENSE.txt" \
            --license "zlib (zlib)=$PWD/build/rel/_deps/zlib-src/LICENSE" \
            --license "LZ4 (BSD-2-Clause)=$PWD/build/rel/_deps/lz4-src/lib/LICENSE" \
            --license "LLVM libc++ (Apache-2.0 WITH LLVM-exception)=$ZIG_DIR/lib/libcxx/LICENSE.TXT"

      - name: Guard (no game code, game files or keys)
        run: python3 tools/release/guard.py dist/*.zip

      - name: AppImage (issue #55)
        # one file, no unzipping: drops portable.txt, so setup keeps everything in the per-user folders.
        # The trailing slash in the glob picks the packaged folder, not its .zip.
        run: |
          # the runtime is pinned (appimage.py RUNTIME, SHA-256 checked; a mismatch fails here)
          python3 tools/release/appimage.py dist/NSMBU-*/ --out dist
          PIN=$(cd tools/release && python3 -c 'import appimage; print(appimage.RUNTIME_COMMIT)')
          dist/*.AppImage --appimage-version 2>&1 | grep -F "type2-runtime/commit/$PIN"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract)
          python3 tools/release/guard.py "$RUNNER_TEMP"/squashfs-root
          # the real mount is read-only: make the extracted tree that too, so a write into <image>/data
          # would fail here instead of silently working on a writable temp dir
          chmod -R a-w "$RUNNER_TEMP"/squashfs-root
          APP=$(echo "$GITHUB_WORKSPACE"/dist/*.AppImage)
          chmod +x "$APP"
          # an explicit data folder is honoured
          SDL_VIDEO_DRIVER=offscreen "$APP" --appimage-extract-and-run --self-test --data-dir "$RUNNER_TEMP/data-appi"
          test -f "$RUNNER_TEMP/data-appi/setup.log"
          # without one: the per-user folder, never <image>/data, and the image stays untouched (issue #55)
          XDG_DATA_HOME="$RUNNER_TEMP/xdg-data" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-conf" \
            SDL_VIDEO_DRIVER=offscreen "$RUNNER_TEMP/squashfs-root/AppRun" --self-test
          test -f "$RUNNER_TEMP/xdg-data/nsmbu/setup.log"
          test ! -e "$RUNNER_TEMP/squashfs-root/data"
          test ! -e "$GITHUB_WORKSPACE/dist/data"
          test ! -e "$GITHUB_WORKSPACE/dist/portable.txt"
          chmod -R u+w "$RUNNER_TEMP"/squashfs-root && rm -rf "$RUNNER_TEMP"/squashfs-root

      - name: Installer self-test (unzipped release, placeholder code, toolchain download)
        run: |
          mkdir -p "$RUNNER_TEMP/unz" && cd "$RUNNER_TEMP/unz" && unzip -q "$GITHUB_WORKSPACE"/dist/*.zip
          cd NSMBU-*
          ./tools/setup-in-terminal.sh --yes --no-launch --gen-dir "$GITHUB_WORKSPACE/build/gen-stub" --data-dir "$RUNNER_TEMP/data"
          # the right architecture: the game the installer linked and the program a player starts
          want=$([ "$ARCH" = aarch64 ] && echo "ARM aarch64" || echo "x86-64")
          file "$RUNNER_TEMP/data/bin/nsmbu" ./nsmbu-launcher
          file "$RUNNER_TEMP/data/bin/nsmbu" | grep -q "$want"
          file ./nsmbu-launcher | grep -q "$want"
          ldd "$RUNNER_TEMP/data/bin/nsmbu"
          NSMBU_HIDDEN_WINDOWS=1 "$RUNNER_TEMP/data/bin/nsmbu" --game "$RUNNER_TEMP/nogame" > run.log 2>&1 || true
          cat run.log
          grep -q "Game folder not found" run.log
          ldd ./nsmbu-launcher
          SDL_VIDEO_DRIVER=offscreen ./nsmbu-launcher --self-test --data-dir "$RUNNER_TEMP/data"

      - name: Renderer smoke test of the installed executable (lavapipe)
        # the 22.04 runner's Mesa is old; a failure here is reported but does not block the release
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "$RUNNER_TEMP/data/bin/nsmbu" --renderer-smoke 2>&1 | tee smoke.log
          grep -q "PASS" smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    # x86-64 and arm64 (Windows on ARM, Snapdragon X), each built and tested on its own
    # architecture's runner with the llvm-mingw for that host and target
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            toolchain: llvm-mingw-20260922
            triple: x86_64-w64-mingw32
            dlltool_machine: i386:x86-64
            python: windows
          - arch: arm64
            runner: windows-11-arm
            toolchain: llvm-mingw-20260922-aarch64
            triple: aarch64-w64-mingw32
            dlltool_machine: arm64
            python: windows-arm64
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TOOLCHAIN: ${{ matrix.toolchain }}
      TRIPLE: ${{ matrix.triple }}
      PY_PIN: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: LuaJIT submodule
        run: git submodule update --init vendor/luajit

      - name: Pinned llvm-mingw toolchain (installer/toolchains.json)
        run: |
          read -r URL SUM DIR < <(python -c "
          import json, os; t=json.load(open('installer/toolchains.json'))['toolchains'][os.environ['TOOLCHAIN']]
          print(t['url'], t['sha256'], t['dir'])" | tr -d '\r')  # Windows Python ends lines with CR LF
          T="$(cygpath -m "$RUNNER_TEMP")"
          curl -fsSL -o "$T/llvm-mingw.zip" "$URL"
          echo "$SUM  $T/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$T/llvm-mingw.zip" -d "$T"
          echo "LLVM_MINGW=$T/$DIR" >> "$GITHUB_ENV"
          echo "$T/$DIR/bin" >> "$GITHUB_PATH"
          "$T/$DIR/bin/$TRIPLE-clang.exe" --version
          pip install ninja
          ninja --version

      - name: Vulkan headers and import library
        run: |
          T="$(cygpath -m "$RUNNER_TEMP")"
          curl -fsSL -o vh.tar.gz "$VULKAN_HEADERS_URL"
          echo "$VULKAN_HEADERS_SHA256  vh.tar.gz" | sha256sum -c -
          mkdir -p "$T/vulkan" && tar -xzf vh.tar.gz -C "$T/vulkan" --strip-components=1
          curl -fsSL -o vulkan-1.def "$VULKAN_DEF_URL"
          echo "$VULKAN_DEF_SHA256  vulkan-1.def" | sha256sum -c -
          "$LLVM_MINGW/bin/llvm-dlltool.exe" -m ${{ matrix.dlltool_machine }} -d vulkan-1.def -l "$T/vulkan/libvulkan-1.a"
          echo "VULKAN_DIR=$T/vulkan" >> "$GITHUB_ENV"

      - name: SDL3 from nsmbu-recomp/ci-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release/sdl3.py install --platform "windows-${{ matrix.arch }}" --dest "$(cygpath -m "$RUNNER_TEMP/sdl3")"
          echo "SDL3_PREFIX=$(cygpath -m "$RUNNER_TEMP/sdl3")" >> "$GITHUB_ENV"

      - name: Build runtime (Release, Vulkan + SDL3) with llvm-mingw against placeholder guest code
        run: |
          python tools/recomp/stubgen.py build/gen-stub
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DNSMBU_VERSION="$VERSION" -DGEN_DIR="$(cygpath -m "$PWD/build/gen-stub")" \
            -DCMAKE_C_COMPILER="$LLVM_MINGW/bin/$TRIPLE-clang.exe" \
            -DCMAKE_CXX_COMPILER="$LLVM_MINGW/bin/$TRIPLE-clang++.exe" \
            -DCMAKE_RC_COMPILER="$LLVM_MINGW/bin/$TRIPLE-windres.exe" \
            -DCMAKE_EXE_LINKER_FLAGS=-static -DNSMBU_BUNDLED_DEPS=ON -DNSMBU_SETUP_GUI=ON \
            -DCMAKE_PREFIX_PATH="$SDL3_PREFIX" \
            -DVulkan_INCLUDE_DIR="$VULKAN_DIR/include" -DVulkan_LIBRARY="$VULKAN_DIR/libvulkan-1.a"
          ninja -C build/rel -d keeprsp

      - name: Unit tests
        run: |
          ctest --test-dir build/rel --output-on-failure
          python installer/test_setup.py

      - name: Pinned embeddable Python, shipped in the release (installer/toolchains.json)
        # the setup runs with it (tools/python); the release itself downloads no Python (issue #58)
        run: |
          read -r URL SUM < <(python -c "
          import json, os; p=json.load(open('installer/toolchains.json'))['python'][os.environ['PY_PIN']]
          print(p['url'], p['sha256'])" | tr -d '\r')
          T="$(cygpath -m "$RUNNER_TEMP")"
          curl -fsSL -o "$T/python-embed.zip" "$URL"
          echo "$SUM  $T/python-embed.zip" | sha256sum -c -
          echo "WIN_PY_ZIP=$T/python-embed.zip" >> "$GITHUB_ENV"

      - name: Package
        run: |
          W="$(cygpath -m "$PWD")"  # native Windows Python cannot open /d/a/... paths
          python tools/release/package.py --build build/rel --platform windows-${{ matrix.arch }} --version "$VERSION" \
            --out dist --toolchain "$TOOLCHAIN" --setup-gui build/rel/nsmbu-setup.exe \
            --windows-python "$WIN_PY_ZIP" \
            --runtime-file build/rel/SDL3.dll \
            --license "SDL3 (zlib)=$SDL3_PREFIX/LICENSE.txt" \
            --license "Vulkan-Headers (Apache-2.0)=$VULKAN_DIR/LICENSE.md" \
            --license "glslang (BSD-3-Clause and others)=$W/build/rel/_deps/glslang-src/LICENSE.txt" \
            --license "zlib (zlib)=$W/build/rel/_deps/zlib-src/LICENSE" \
            --license "LZ4 (BSD-2-Clause)=$W/build/rel/_deps/lz4-src/lib/LICENSE" \
            --license "LLVM libc++ (Apache-2.0 WITH LLVM-exception)=$LLVM_MINGW/LICENSE.TXT"

      - name: Guard (no game code, game files or keys)
        run: python tools/release/guard.py dist/*.zip

      - name: Unzip the release for the installer self-test
        shell: pwsh
        run: |
          $unz = Join-Path $env:RUNNER_TEMP 'unz'
          New-Item -ItemType Directory -Force -Path $unz | Out-Null
          Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath $unz
          $pkg = (Get-ChildItem $unz -Directory)[0].FullName
          "NSMBU_PKG=$pkg" >> $env:GITHUB_ENV
          "NSMBU_DATA_DIR=$(Join-Path $env:RUNNER_TEMP 'data')" >> $env:GITHUB_ENV
          # no script host in the Windows release (antivirus false positives, issue #58)
          if (Get-ChildItem $pkg -Recurse -Include *.ps1, *.vbs, *.js, *.hta) { throw "a script file is in the release" }
          $bytes = [IO.File]::ReadAllBytes((Join-Path $pkg 'NSMBU.exe'))
          foreach ($enc in [Text.Encoding]::ASCII, [Text.Encoding]::Unicode) {
            foreach ($word in 'powershell', 'ExecutionPolicy', 'Unblock-File') {
              if ($enc.GetString($bytes).IndexOf($word, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "NSMBU.exe contains '$word'" }
            }
          }
          # no download code: no network library among its imports (import names are ASCII)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($dll in 'winhttp.dll', 'wininet.dll', 'urlmon.dll', 'ws2_32.dll', 'bcrypt.dll') {
            if ($ascii.IndexOf($dll, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "NSMBU.exe imports $dll" }
          }
          # the bundled Python is the official one, unmodified: its programs and DLLs keep the PSF signature
          foreach ($f in 'python.exe', 'pythonw.exe', 'python3.dll', 'python313.dll') {
            $sig = Get-AuthenticodeSignature (Join-Path $pkg "tools\python\$f")
            "tools\python\$f`: $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
              throw "tools\python\$f does not carry a valid PSF signature"
            }
          }
          # version information, a manifest and no debug sections (cmake/WindowsResources.cmake, NSMBU_STRIP_RELEASE)
          foreach ($f in 'NSMBU.exe', 'tools\bin\nsmbu-extract.exe') {
            $p = Join-Path $pkg $f
            $vi = (Get-Item $p).VersionInfo
            if ($vi.ProductName -ne 'NSMBU Recomp' -or $vi.CompanyName -ne 'NSMBURecomp') { throw "$f has no version information" }
            "$f`: $($vi.FileDescription), $($vi.ProductVersion), $($vi.OriginalFilename)"
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($p))
            if ($text.IndexOf('.debug_info') -ge 0) { throw "$f still has debug sections" }
            if ($text.IndexOf('requestedExecutionLevel') -lt 0) { throw "$f has no application manifest" }
          }

      - name: Installer self-test, setup in a console window (bundled Python, toolchain download)
        # the .bat as a player starts it (it runs "NSMBU.exe --console-setup"); no input
        shell: cmd
        run: |
          call "%NSMBU_PKG%\tools\Setup in a console window.bat" --yes --no-launch --gen-dir "%GITHUB_WORKSPACE%\build\gen-stub" --data-dir "%NSMBU_DATA_DIR%" < NUL
          if errorlevel 1 exit /b 1

      - name: Installer self-test (unzipped release, placeholder code)
        shell: pwsh
        run: |
          $pkg = $env:NSMBU_PKG
          $data = $env:NSMBU_DATA_DIR
          if (Test-Path (Join-Path $data 'python')) { throw "the setup downloaded a Python (it should use tools\python)" }
          if (-not (Test-Path (Join-Path $data 'install.json'))) { throw "the console setup did not finish" }
          $exe = Join-Path $data 'bin\nsmbu.exe'
          if (-not (Test-Path (Join-Path $data 'bin\SDL3.dll'))) { throw "SDL3.dll was not installed" }
          # no game files: the executable must start and stop with "Game folder not found" (abort() may leave
          # an error-reporting process around, so do not wait forever)
          $env:NSMBU_HIDDEN_WINDOWS = '1'
          $p = Start-Process -FilePath $exe -ArgumentList '--game', (Join-Path $env:RUNNER_TEMP 'nogame') `
            -RedirectStandardError run.log -RedirectStandardOutput out.log -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Remove-Item Env:NSMBU_HIDDEN_WINDOWS -ErrorAction SilentlyContinue
          Get-Content run.log, out.log
          if (-not (Select-String -Path run.log, out.log -Pattern 'Game folder not found' -Quiet)) { throw "the installed executable did not start" }
          # the graphical installer (GUI subsystem: wait for it explicitly)
          $env:SDL_VIDEO_DRIVER = 'offscreen'
          $g = Start-Process -FilePath (Join-Path $pkg 'NSMBU.exe') `
            -ArgumentList '--self-test', '--data-dir', $data -PassThru
          $null = $g.Handle  # keeps the process handle so ExitCode is available after it exits
          if (-not $g.WaitForExit(600000)) { $g.Kill(); throw "the setup program did not finish its self-test" }
          if ($g.ExitCode -ne 0) { throw "setup program self-test failed ($($g.ExitCode))" }
          # the window on a fresh data folder: setup.py starts with the bundled Python, nothing is downloaded
          $env:NSMBU_DATA_DIR = Join-Path $env:RUNNER_TEMP 'data-gui'
          $g = Start-Process -FilePath (Join-Path $pkg 'NSMBU.exe') `
            -ArgumentList '--self-test', '--data-dir', $env:NSMBU_DATA_DIR -PassThru
          $null = $g.Handle
          if (-not $g.WaitForExit(600000)) { $g.Kill(); throw "the setup program did not finish its self-test (fresh data folder)" }
          if ($g.ExitCode -ne 0) { throw "setup program self-test on a fresh data folder failed ($($g.ExitCode))" }
          if (Test-Path (Join-Path $env:NSMBU_DATA_DIR 'python')) { throw "the window downloaded a Python" }

      - name: Installer self-test in a deep folder (long paths)
        # Windows' "Extract All" puts the release folder into a folder of the same name. The release here is
        # as deep as setup accepts (174 characters): the compiler's deepest files are then beyond MAX_PATH while
        # setup unpacks them (it uses \\?\ paths). One character deeper, setup stops before it downloads anything.
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*.zip).FullName
          $name = [IO.Path]::GetFileNameWithoutExtension($zip)
          $root = Join-Path $env:RUNNER_TEMP 'deep'
          $outer = Join-Path $root ('x' * (174 - $root.Length - 2 - $name.Length))
          Expand-Archive -Path $zip -DestinationPath $outer
          $pkg = Join-Path $outer $name
          if ($pkg.Length -ne 174) { throw "the release folder is $($pkg.Length) characters, not 174" }
          "NSMBU_DEEP_PKG=$pkg" >> $env:GITHUB_ENV

      - name: Installer self-test in a deep folder, setup in a console window
        shell: cmd
        run: |
          call "%NSMBU_DEEP_PKG%\tools\Setup in a console window.bat" --yes --no-launch --gen-dir "%GITHUB_WORKSPACE%\build\gen-stub" < NUL
          if errorlevel 1 exit /b 1

      - name: Installer self-test in a deep folder, results
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*.zip).FullName
          $name = [IO.Path]::GetFileNameWithoutExtension($zip)
          $pkg = $env:NSMBU_DEEP_PKG
          $outer = Split-Path $pkg -Parent
          $data = Join-Path $pkg 'data'
          if (-not (Test-Path (Join-Path $data 'install.json'))) { throw "the setup in a deep folder did not finish" }
          $deepest = python -c "import sys, zipfile; print(max(zipfile.ZipFile(sys.argv[1]).namelist(), key=len))" (Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip')
          $deepest = $deepest.Trim().Replace('/', '\')
          $unpacked = Join-Path $data "toolchain\unpack.tmp\$deepest"
          "deepest compiler file while unpacking: $($unpacked.Length) characters"
          if ($unpacked.Length -le 259) { throw "the test folder is not deep enough to cross MAX_PATH" }
          if (-not (Test-Path -LiteralPath ('\\?\' + (Join-Path $data "toolchain\$deepest")))) { throw "the deepest compiler file is missing" }
          if (Test-Path (Join-Path $data 'toolchain\unpack.tmp')) { throw "unpack.tmp was left behind" }
          $env:NSMBU_HIDDEN_WINDOWS = '1'
          $p = Start-Process -FilePath (Join-Path $data 'bin\nsmbu.exe') -ArgumentList '--game', (Join-Path $env:RUNNER_TEMP 'nogame') `
            -RedirectStandardError deep-run.log -RedirectStandardOutput deep-out.log -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Remove-Item Env:NSMBU_HIDDEN_WINDOWS -ErrorAction SilentlyContinue
          if (-not (Select-String -Path deep-run.log, deep-out.log -Pattern 'Game folder not found' -Quiet)) { throw "the game built in a deep folder did not start" }
          # one character deeper: setup stops at once with the plain message
          Expand-Archive -Path $zip -DestinationPath ($outer + 'x')
          $pkg = Join-Path ($outer + 'x') $name
          $out = & (Join-Path $pkg 'tools\python\python.exe') (Join-Path $pkg 'installer\setup.py') --yes --no-launch `
            --gen-dir (Join-Path $env:GITHUB_WORKSPACE 'build\gen-stub') 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 1) { throw "setup in a too deep folder exited with $LASTEXITCODE, not 1" }
          if ($out -notmatch "This folder's path is too long for Windows \(175 characters, at most 174 work\)") { throw "no path length message" }
          if ($out -match 'Getting the compiler') { throw "setup went on in a too deep folder" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            name: arm64
          - abi: x86_64
            name: x86_64
    name: android-${{ matrix.name }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ABI: ${{ matrix.abi }}
      NDK_VERSION: 30.0.16248370
      CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      APK: dist/NSMBU-${{ needs.version.outputs.version }}-android-${{ matrix.name }}.apk
    steps:
      - uses: actions/checkout@v5

      - name: LuaJIT submodule
        run: git submodule update --init vendor/luajit

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install the NDK and SDK packages
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;35.0.0"

      - name: Compiler that runs on Android (android-clang release)
        uses: ./.github/actions/android-compiler
        with:
          abi: ${{ matrix.abi }}

      - name: Compiler files for the APK
        run: python3 tools/android/package_toolchain.py --compiler build/compiler/package --out build/compiler/apk-package

      - name: Runtime, extractor and runtime SDK (placeholder game code, only to build the runtime)
        run: |
          python3 tools/recomp/stubgen.py build/gen-stub
          GEN_DIR="$PWD/build/gen-stub" ANDROID_SDK="$ANDROID_HOME" ABI="$ABI" JOBS=4 android/build_native.sh
          cmake --build android/build/game --target nsmbu-extract --parallel 4
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          python3 tools/android/package_extractor.py --build android/build/game --ndk "$NDK" --abi "$ABI" --out build/extractor-apk
          python3 tools/android/package_runtime.py --build android/build/game --ndk "$NDK" --abi "$ABI" --out build/runtime-sdk --version "$VERSION"
          rm "android/app/libs/$ABI/libmain.so"
          ls -la "android/app/libs/$ABI"

      - name: Cache the official CPython Android build (checksum-pinned in prepare_python.py)
        uses: actions/cache@v5
        with:
          path: build/embedded-python/python.tar.gz
          key: android-cpython-${{ matrix.abi }}-${{ hashFiles('tools/android/prepare_python.py') }}

      - name: Embedded Python and setup (no test fixtures)
        run: |
          python3 tools/android/prepare_python.py --abi "$ABI" --ndk "$ANDROID_HOME/ndk/$NDK_VERSION" \
            --out build/embedded-python --runtime-sdk build/runtime-sdk

      - name: Release APK, signed with the project's key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NSMBU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSMBU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSMBU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISHING: ${{ needs.version.outputs.publish }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            export NSMBU_KEYSTORE="$RUNNER_TEMP/nsmbu-release.p12"
            trap 'rm -f "$NSMBU_KEYSTORE"' EXIT
            (umask 077 && printf '%s' "$KEYSTORE_B64" | base64 -d > "$NSMBU_KEYSTORE")
          elif [ "$PUBLISHING" = true ]; then
            echo "::error::the signing secrets are missing: a published APK must carry the release key"; exit 1
          else
            echo "::warning::no signing secrets (fork or dry run): the APK is signed with a throwaway debug key"
          fi
          android/gradlew -p android --no-daemon -PnsmbuAbi="$ABI" -PnsmbuVersionName="${VERSION#v}" \
            -PnsmbuVersionCode="${{ github.run_number }}" \
            -PnsmbuPythonDir="$PWD/build/embedded-python/package" -PnsmbuToolchainDir="$PWD/build/compiler/apk-package" \
            -PnsmbuExtractorDir="$PWD/build/extractor-apk" assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          ls -la dist

      - name: Guard (no game code, game files, keys or test fixtures) and signature
        env:
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          python3 tools/release/guard.py "$APK"
          if unzip -l "$APK" | grep -E ' lib/[^/]+/libmain\.so$'; then echo "::error::libmain.so in the APK"; exit 1; fi
          for f in toolchain-apk.json runtime-sdk.json extractor-apk.json python-source.zip; do
            unzip -l "$APK" "assets/$f" > /dev/null || { echo "::error::assets/$f missing"; exit 1; }
          done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          if [ "$SIGNED" = true ] && [ -n "$CERT_SHA256" ]; then
            grep -q "^Signer #1 certificate SHA-256 digest: $CERT_SHA256\$" apksigner.txt \
              || { echo "::error::the APK is not signed with the release certificate"; exit 1; }
          fi
          if grep -q '^Signer #2' apksigner.txt; then echo "::error::more than one signer"; exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | sed -n 1p

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ matrix.name }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, macos, linux, windows, android]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      DEVEL: ${{ needs.version.outputs.devel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Guard all artifacts again
        run: python3 tools/release/guard.py dist/*.zip dist/*.apk

      - name: Checksums and release notes
        run: |
          cd dist && sha256sum *.zip *.AppImage *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          if [[ "$DEVEL" == true ]]; then
            python3 tools/release/notes.py README.md "$VERSION" --devel "$GITHUB_SHA" > dist/notes.md
          else
            python3 tools/release/notes.py README.md "$VERSION" > dist/notes.md
          fi
          cat dist/notes.md
          python3 tools/release/guard.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: dist/*

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        run: |
          gh release create "$VERSION" dist/*.zip dist/*.AppImage dist/*.apk dist/SHA256SUMS.txt --title "$VERSION" --notes-file dist/notes.md \
            --verify-tag

      # The rolling pre-release "devel-build": the previous one and its tag are replaced; never marked latest.
      - name: Publish development pre-release
        if: env.DEVEL == 'true'
        run: |
          gh release delete devel-build --cleanup-tag --yes 2>/dev/null || true
          gh release create devel-build dist/*.zip dist/*.AppImage dist/SHA256SUMS.txt --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Development build (main @ ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d))" \
            --notes-file dist/notes.md
